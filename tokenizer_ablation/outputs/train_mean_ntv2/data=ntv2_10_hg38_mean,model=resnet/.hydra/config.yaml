data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_10_hg38.h5
  val_csv: data/val_ntv2_10_hg38.h5
  test_csv: data/test_ntv2_10_hg38.h5
  embedding_dim: 1024
  seq_length: 10
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: D3ABD602F1AC5C537CB18D92CF8C4FC36C93FEB8CB19D1D46B7881285C134148
  val_sha256: 134BBF680231A145A037A6815AC8A9B89600A21165E5A37862A259B8FBD1A938
  test_sha256: F9271ED4BEFBC7FDF0D071E61140EC4BEBF20E5FB0C7516139007F7BBDF38387
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
