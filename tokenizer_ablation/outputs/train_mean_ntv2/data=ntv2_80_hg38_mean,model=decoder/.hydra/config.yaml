data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_80_hg38.h5
  val_csv: data/val_ntv2_80_hg38.h5
  test_csv: data/test_ntv2_80_hg38.h5
  embedding_dim: 1024
  seq_length: 80
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: FB89E654A8B7F918B02336C724DBB40328B0DC5D64E4E5287A6213B82406DF2F
  val_sha256: 4B5BB9F91E106482D1DB3B3400A3D3035A515863AF5D10AF7EA3D3233E3A0469
  test_sha256: D40CAC6A21B05197A4E5C27649202A6D60BBCF0678122A99F9DA5B2CBCB94C51
model:
  model_file_name: model/decoder.py
  model_name: decoder_mean
  model_type: decoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.2
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
