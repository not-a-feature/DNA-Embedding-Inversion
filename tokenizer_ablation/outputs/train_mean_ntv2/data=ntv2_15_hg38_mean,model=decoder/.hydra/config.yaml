data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_15_hg38.h5
  val_csv: data/val_ntv2_15_hg38.h5
  test_csv: data/test_ntv2_15_hg38.h5
  embedding_dim: 1024
  seq_length: 15
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: 257A8AD7A5C4672817AF92796216E4BA25F1A4C9D989B532FE0EE41CD0132F4F
  val_sha256: B9EE25530273F94790220B4E462C59F5B82AF8239197E324B4101A3CDA48B6CF
  test_sha256: 6919249D8002FE443930B26498C1845ABADB2EDEC335073E7D598945C7F87636
model:
  model_file_name: model/decoder.py
  model_name: decoder_mean
  model_type: decoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.2
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
