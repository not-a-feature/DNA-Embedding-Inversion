data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_90_hg38.h5
  val_csv: data/val_ntv2_90_hg38.h5
  test_csv: data/test_ntv2_90_hg38.h5
  embedding_dim: 1024
  seq_length: 90
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: 2222C159F4E6A67F4DA608308EAE8A653673BE50DA09BD5D62772C2778E26EF9
  val_sha256: CED518A8B1FFD5C7085BDE1B95F1199C1F2A95A761D2F9D5E0C245FE6D734FFA
  test_sha256: 83B91C2C334A0B2E7D92A8664F2859A59D61F75237D6084110C37F4E1DB48AF8
model:
  model_file_name: model/knn.py
  model_name: knn
  model_type: knn
  mode: mean
  k: 1
  hidden_dims: []
  dropout: 0.0
  output_dim: 4
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
