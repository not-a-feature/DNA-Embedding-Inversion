data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_20_hg38.h5
  val_csv: data/val_ntv2_20_hg38.h5
  test_csv: data/test_ntv2_20_hg38.h5
  embedding_dim: 1024
  seq_length: 20
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: 71B466100CE2ACE0DC2CAA16EE9BBD89A2D6B86BB70F9C4EBB1B3CD1B0EA3CB8
  val_sha256: DC102D336DFD2051AF39552BD6854AC7F2F9E46CF78A0A14B5AB300957220DC7
  test_sha256: 38F3B27420E1F80D17EE5D227467980C80EE7FE2BE636BBA0B6E91B34056A84B
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
