data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_45_hg38.h5
  val_csv: data/val_ntv2_45_hg38.h5
  test_csv: data/test_ntv2_45_hg38.h5
  embedding_dim: 1024
  seq_length: 45
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: A5663391DC71461FD0BAB0CF819DC6CF23953D6FB33F3A47F8CB7CB1A22E3AD8
  val_sha256: 2B66955E720EA1E3294FDA16881E9B6075BE61DC7B97BC5866A56BBF85436786
  test_sha256: 9888DAED858CD912F1EB66E0323850B1A751AA8F0AEF460C70117B545378B6AE
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
