data:
  shuffle: true
  mean: true
  train_csv: data/train_dnabert2_70_hg38.h5
  val_csv: data/val_dnabert2_70_hg38.h5
  test_csv: data/test_dnabert2_70_hg38.h5
  embedding_dim: 768
  seq_length: 70
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: zhihan1996/DNABERT-2-117M
  checkpoint: zhihan1996/DNABERT-2-117M
  train_sha256: 44882DB3A2A418C3CC1342DB073EDBBF4DBAA56CD57A82F247E850B021CDCF83
  val_sha256: CAFACDF6F518E909C662A8B9E541C183CFB79725DB5E9560018230EC880EEC77
  test_sha256: 024318D5B7A979678D7DF2E1CC492A66ADDDE14BAA20427A9A1D3FCEDD276FA4
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
