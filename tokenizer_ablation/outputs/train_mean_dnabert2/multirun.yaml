hydra:
  run:
    dir: outputs/train-${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: outputs/train_mean_dnabert2
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(asctime)s | %(levelname)s | %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.sweep.dir=outputs/train_mean_dnabert2
    - hydra.sweep.subdir=${hydra.job.override_dirname}
    - hydra.job.chdir=True
    - hydra.mode=MULTIRUN
    task:
    - data=dnabert2_10_hg38_mean,dnabert2_15_hg38_mean,dnabert2_20_hg38_mean,dnabert2_25_hg38_mean,dnabert2_30_hg38_mean,dnabert2_35_hg38_mean,dnabert2_40_hg38_mean,dnabert2_45_hg38_mean,dnabert2_50_hg38_mean,dnabert2_60_hg38_mean,dnabert2_70_hg38_mean,dnabert2_80_hg38_mean,dnabert2_90_hg38_mean,dnabert2_100_hg38_mean
    - model=resnet
  job:
    name: train
    chdir: true
    override_dirname: data=dnabert2_10_hg38_mean,dnabert2_15_hg38_mean,dnabert2_20_hg38_mean,dnabert2_25_hg38_mean,dnabert2_30_hg38_mean,dnabert2_35_hg38_mean,dnabert2_40_hg38_mean,dnabert2_45_hg38_mean,dnabert2_50_hg38_mean,dnabert2_60_hg38_mean,dnabert2_70_hg38_mean,dnabert2_80_hg38_mean,dnabert2_90_hg38_mean,dnabert2_100_hg38_mean,model=resnet
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /weka/pfeifer/ppu738/DNA_Foundation_Models_Inversion_Attack_Benchmark2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /weka/pfeifer/ppu738/DNA_Foundation_Models_Inversion_Attack_Benchmark2/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      model: resnet
      data: dnabert2_100_hg38_per_token
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data:
  shuffle: true
  mean: false
  train_csv: data/train_dnabert2_100_hg38_per_token.h5
  val_csv: data/val_dnabert2_100_hg38_per_token.h5
  test_csv: data/test_dnabert2_100_hg38_per_token.h5
  embedding_dim: 768
  seq_length: 100
  train_sha256: 1BB5F37719FBE6CE6F6217A00ED4BA80C4CB7D306B532BEB47BF6D0BADCF7DEF
  val_sha256: 5A1235670B2E78305335CFCEC255EA6DA2A1D88577C183C3BF39BC31E00B6D9C
  test_sha256: 56A97A73B7098C8C38790E439A8B40EFE6409C44897E9A0EC9AB791B65EBE03E
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: zhihan1996/DNABERT-2-117M
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
