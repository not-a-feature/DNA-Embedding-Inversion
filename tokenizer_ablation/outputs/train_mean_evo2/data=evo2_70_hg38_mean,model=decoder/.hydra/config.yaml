data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_70_hg38.h5
  val_csv: data/val_evo2_deep_70_hg38.h5
  test_csv: data/test_evo2_deep_70_hg38.h5
  embedding_dim: 4096
  seq_length: 70
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 1501D1D1861823732A5DDDF94279E1D1DB6A0836E9E44E9FF4AB766FE35F8D39
  val_sha256: 41BB228478B4E7C59693A5B48F28AF9CA6A1828AA550740028A77D4FA5D62040
  test_sha256: 3FEDA33748631F6AC300137E75469C53B410B88DAD86A897945DDB7A082B135E
model:
  model_file_name: model/decoder.py
  model_name: decoder_mean
  model_type: decoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.2
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
