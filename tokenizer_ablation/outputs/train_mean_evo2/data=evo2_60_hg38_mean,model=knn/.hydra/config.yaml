data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_60_hg38.h5
  val_csv: data/val_evo2_deep_60_hg38.h5
  test_csv: data/test_evo2_deep_60_hg38.h5
  embedding_dim: 4096
  seq_length: 60
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
