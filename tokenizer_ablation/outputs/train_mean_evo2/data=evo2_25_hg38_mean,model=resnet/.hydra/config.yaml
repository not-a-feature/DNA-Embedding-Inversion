data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_25_hg38.h5
  val_csv: data/val_evo2_deep_25_hg38.h5
  test_csv: data/test_evo2_deep_25_hg38.h5
  embedding_dim: 4096
  seq_length: 25
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: A2E9D108CF81611184DE65EA8BEA5631B8B2913FED5456B6984B4934A994E069
  val_sha256: 2296B0ABE00E1457331A3366B5F0FDB684C2C7F5EDDD9064C15DC81F460B538C
  test_sha256: 452A68701D2BB194099E8783C3B7D4EA4C66807BE05E896B2471DE4641FBB9F8
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
