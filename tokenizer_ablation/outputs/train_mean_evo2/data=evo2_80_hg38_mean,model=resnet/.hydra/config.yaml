data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_80_hg38.h5
  val_csv: data/val_evo2_deep_80_hg38.h5
  test_csv: data/test_evo2_deep_80_hg38.h5
  embedding_dim: 4096
  seq_length: 80
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: FC583B624E94F68D8D53889469C65DFD6050440991F6DA72F0F7F1650DDE4404
  val_sha256: 7BC628F938D48DFD0E323D650A91EA25EDB565104E4567DEC42F629405CA84AE
  test_sha256: 9DC0B0EFFCE6CC9E17127FFC51D9262A61A7EA3A3797D743AE26C4926185863F
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
