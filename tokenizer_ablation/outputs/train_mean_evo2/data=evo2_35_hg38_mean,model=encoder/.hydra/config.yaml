data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_35_hg38.h5
  val_csv: data/val_evo2_deep_35_hg38.h5
  test_csv: data/test_evo2_deep_35_hg38.h5
  embedding_dim: 4096
  seq_length: 35
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: C12B791351CA422A8B1F5988B3AA9E220F6B7003E96B17406568CE7B14F188FC
  val_sha256: CAE970EA351E8B8F90FB53B5B6449ABD9B417ABCE75A1E1EEA0D49483FF9F0D5
  test_sha256: AF2A66B90A9B0A6501A0542F2DED8586F9B7068270937F1B2A9F7E448758ED5D
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
