data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_45_hg38.h5
  val_csv: data/val_evo2_deep_45_hg38.h5
  test_csv: data/test_evo2_deep_45_hg38.h5
  embedding_dim: 4096
  seq_length: 45
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 14D733B8835157A0A88B8A830A65FD77578B386BD73F2AF76AAFECCB454050EC
  val_sha256: 176D37ACB2BF63A09DAE0D226B3631D0AE207F4D20D035D52DFB2D4E2C493E2C
  test_sha256: 31FB0E4B433A45F961DFD759EEBB9744FF4DE9A946537038B697059B86A94FBC
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
