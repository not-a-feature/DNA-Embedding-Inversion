shuffle: true
mean: true
multi: true

seq_lengths: [10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100]

# Historical multi-length configuration: one train_csvs entry per seq_length.
# The earlier corpus folded extra long-sequence rows into these base files;
# there are no separate shards. val_csvs/test_csvs align with seq_lengths.
train_seq_lengths: [10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100]

train_csvs:
  - data/hg38/train_dnabert2_10_hg38.h5
  - data/hg38/train_dnabert2_15_hg38.h5
  - data/hg38/train_dnabert2_20_hg38.h5
  - data/hg38/train_dnabert2_25_hg38.h5
  - data/hg38/train_dnabert2_30_hg38.h5
  - data/hg38/train_dnabert2_35_hg38.h5
  - data/hg38/train_dnabert2_40_hg38.h5
  - data/hg38/train_dnabert2_45_hg38.h5
  - data/hg38/train_dnabert2_50_hg38.h5
  - data/hg38/train_dnabert2_60_hg38.h5
  - data/hg38/train_dnabert2_70_hg38.h5
  - data/hg38/train_dnabert2_80_hg38.h5
  - data/hg38/train_dnabert2_90_hg38.h5
  - data/hg38/train_dnabert2_100_hg38.h5

val_csvs:
  - data/hg38/val_dnabert2_10_hg38.h5
  - data/hg38/val_dnabert2_15_hg38.h5
  - data/hg38/val_dnabert2_20_hg38.h5
  - data/hg38/val_dnabert2_25_hg38.h5
  - data/hg38/val_dnabert2_30_hg38.h5
  - data/hg38/val_dnabert2_35_hg38.h5
  - data/hg38/val_dnabert2_40_hg38.h5
  - data/hg38/val_dnabert2_45_hg38.h5
  - data/hg38/val_dnabert2_50_hg38.h5
  - data/hg38/val_dnabert2_60_hg38.h5
  - data/hg38/val_dnabert2_70_hg38.h5
  - data/hg38/val_dnabert2_80_hg38.h5
  - data/hg38/val_dnabert2_90_hg38.h5
  - data/hg38/val_dnabert2_100_hg38.h5

test_csvs:
  - data/hg38/test_dnabert2_10_hg38.h5
  - data/hg38/test_dnabert2_15_hg38.h5
  - data/hg38/test_dnabert2_20_hg38.h5
  - data/hg38/test_dnabert2_25_hg38.h5
  - data/hg38/test_dnabert2_30_hg38.h5
