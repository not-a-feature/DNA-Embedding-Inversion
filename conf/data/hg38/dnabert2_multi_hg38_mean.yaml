  - data/hg38/test_dnabert2_40_hg38.h5
  - data/hg38/test_dnabert2_45_hg38.h5
  - data/hg38/test_dnabert2_50_hg38.h5
  - data/hg38/test_dnabert2_60_hg38.h5
  - data/hg38/test_dnabert2_70_hg38.h5
  - data/hg38/test_dnabert2_80_hg38.h5
  - data/hg38/test_dnabert2_90_hg38.h5
  - data/hg38/test_dnabert2_100_hg38.h5

embedding_dim: 768
# Maximum sequence length across the multi-length training set. Used by models
# (encoder/decoder/resnet/mlp_mean) to size the fixed-length output head.
seq_length: 100

# Per-file SHA checks are skipped in multi mode (use the per-length configs to verify integrity).
skip_sha256_check: true
normalization_method: standard
subset_fraction: null

tokenizer:
  type: huggingface
  model_name: "zhihan1996/DNABERT-2-117M"

checkpoint: "zhihan1996/DNABERT-2-117M"
