###############################################
# Hydra configuration for tokenizer analysis
# Analyzes subword tokenization for DNABERT-2 and NTv2
###############################################

seed: 42

# Directory containing the sequence CSV files
data_dir: data

# Prefix for the CSV filenames (files are named {csv_prefix}_seq{length}.csv)
csv_prefix: hg38

# Maximum number of sequences to sample per sequence length (null = use all)
n_samples: 500

# Sequence lengths for the token-count-vs-length plot
seq_lengths: [10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100]

# Fixed sequence length for the token-length distribution plot
fixed_length: 100

hydra:
  run:
    dir: outputs/tokenizer_analysis-${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: outputs/tokenizer_analysis-${now:%Y-%m-%d-%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
  job_logging:
    root:
      level: INFO
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    formatters:
      simple:
        format: '%(asctime)s | %(levelname)s | %(message)s'
