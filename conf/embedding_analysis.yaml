###############################################
# Hydra configuration for embedding analysis
# Both UMAP and t-SNE are always performed
# Modify values via CLI overrides, e.g.:
#   python embedding_analysis.py perplexity=50
###############################################

defaults:
  - data: evo2_100_hg38_per_token
  - _self_

# Which splits to analyze: null = all splits, or specify list like ["train", "test"]
splits: null

# List of data configs to compare (e.g. ["dnabert2_10_hg38", "evo2_deep_10_hg38"])
# If empty or null, only analyzes the 'data' config above.
comparison_groups: []

# Random seed for reproducibility
seed: 42
subsample: 2000

# UMAP parameters
n_neighbors: 15
min_dist: 0.1

# t-SNE parameters
perplexity: 30

hydra:
  run:
    dir: outputs/embedding_analysis-${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: outputs/embedding_analysis-${now:%Y-%m-%d-%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
  job_logging:
    root:
      level: INFO
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    formatters:
      simple:
        format: '%(asctime)s | %(levelname)s | %(message)s'
