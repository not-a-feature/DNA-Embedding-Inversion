model_file_name: model/resnet.py
model_name: resnet_mean
model_type: resnet
mode: mean

# ResNet architecture parameters.
# Capacity raised (d_model 256->384, blocks 4->6) because mean-mode runs
# underfit (train~=val).
d_model: 384
n_blocks: 6
kernel_size: 5
dropout: 0.1

# Sequence parameters
output_dim: 4

# For compatibility with training code
hidden_dims: []
