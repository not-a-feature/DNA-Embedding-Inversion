hydra:
  run:
    dir: outputs/embedding_analysis-${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: outputs/analysis_mean_evo2
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(asctime)s | %(levelname)s | %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.sweep.dir=outputs/analysis_mean_evo2
    - hydra.sweep.subdir=${hydra.job.override_dirname}
    - hydra.mode=MULTIRUN
    task:
    - data=evo2_10_hg38_mean,evo2_15_hg38_mean,evo2_20_hg38_mean,evo2_25_hg38_mean,evo2_30_hg38_mean,evo2_35_hg38_mean,evo2_40_hg38_mean,evo2_45_hg38_mean,evo2_50_hg38_mean,evo2_60_hg38_mean,evo2_70_hg38_mean,evo2_80_hg38_mean,evo2_90_hg38_mean,evo2_100_hg38_mean
  job:
    name: embedding_analysis_mean
    chdir: true
    override_dirname: data=evo2_10_hg38_mean,evo2_15_hg38_mean,evo2_20_hg38_mean,evo2_25_hg38_mean,evo2_30_hg38_mean,evo2_35_hg38_mean,evo2_40_hg38_mean,evo2_45_hg38_mean,evo2_50_hg38_mean,evo2_60_hg38_mean,evo2_70_hg38_mean,evo2_80_hg38_mean,evo2_90_hg38_mean,evo2_100_hg38_mean
    id: ???
    num: ???
    config_name: embedding_analysis
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /weka/pfeifer/ppu738/DNA_Foundation_Models_Inversion_Attack_Benchmark
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /weka/pfeifer/ppu738/DNA_Foundation_Models_Inversion_Attack_Benchmark/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      data: evo2_100_hg38_per_token
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data:
  shuffle: true
  mean: false
  train_csv: data/train_evo2_100_hg38_per_token.h5
  val_csv: data/val_evo2_100_hg38_per_token.h5
  test_csv: data/test_evo2_100_hg38_per_token.h5
  embedding_dim: 4096
  seq_length: 100
  train_sha256: 511828991E9D474A46DC0D576B615E2C2E7DFECB198C3F6723A6C57B029F69C4
  val_sha256: 115DECCA9520D8A59445115905A63CBC58D8156D2F4962110A308AB00C4DCD8C
  test_sha256: CE6F85354CD07A523AF9B01D9FE323658515CC43D7100A13F86588149C0F937B
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
splits: null
comparison_groups: []
seed: 42
subsample: 2000
n_neighbors: 15
min_dist: 0.1
perplexity: 30
