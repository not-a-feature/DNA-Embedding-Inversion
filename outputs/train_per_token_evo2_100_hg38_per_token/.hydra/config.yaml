data:
  shuffle: true
  mean: false
  train_csv: data/train_evo2_100_hg38_per_token.h5
  val_csv: data/val_evo2_100_hg38_per_token.h5
  test_csv: data/test_evo2_100_hg38_per_token.h5
  embedding_dim: 4096
  seq_length: 100
  train_sha256: 511828991E9D474A46DC0D576B615E2C2E7DFECB198C3F6723A6C57B029F69C4
  val_sha256: 115DECCA9520D8A59445115905A63CBC58D8156D2F4962110A308AB00C4DCD8C
  test_sha256: CE6F85354CD07A523AF9B01D9FE323658515CC43D7100A13F86588149C0F937B
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
model:
  model_file_name: model/mlp.py
  model_name: mlp_small
  model_type: mlp
  mode: per_token
  hidden_dims:
  - 256
  - 256
  - 128
  dropout: 0.2
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
