data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_40_hg38.h5
  val_csv: data/val_ntv2_40_hg38.h5
  test_csv: data/test_ntv2_40_hg38.h5
  embedding_dim: 1024
  seq_length: 40
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: 2845520488F3F1DCE2456B52807F99BD8EF355E070311D75A3D0CFC7B53A3098
  val_sha256: A3B477483B260CEAE2F5A70BBEE6299F7F44E014B94D9965EE05A0E4CFD70B8C
  test_sha256: 3229E7C48F4EFD5B76DEC2C12291FCEE53096BDFE87DB8AC435BC7271DF0E3BC
model:
  model_file_name: model/knn.py
  model_name: knn
  model_type: knn
  mode: mean
  k: 1
  hidden_dims: []
  dropout: 0.0
  output_dim: 4
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
