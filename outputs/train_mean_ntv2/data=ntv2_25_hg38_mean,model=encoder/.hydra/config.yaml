data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_25_hg38.h5
  val_csv: data/val_ntv2_25_hg38.h5
  test_csv: data/test_ntv2_25_hg38.h5
  embedding_dim: 1024
  seq_length: 25
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: 6703E86C9092A29400EFA240646D0624947ED6A39C2F690207C24183FFA66035
  val_sha256: E371952D096F80D36E7AAE49F5E644DFCCC0FB3B1AAC07229E7DC322A6F4B7B1
  test_sha256: 6D0929955FB2B20035B876355E79C6A96802FCE2576179FBF0C7BB11A49D9E3B
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
