data:
  shuffle: true
  mean: true
  train_csv: data/train_ntv2_60_hg38.h5
  val_csv: data/val_ntv2_60_hg38.h5
  test_csv: data/test_ntv2_60_hg38.h5
  embedding_dim: 1024
  seq_length: 60
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  checkpoint: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
  train_sha256: F9A762947C7AC70034ADEE43F93C29D105BEF3423CABFE1A23B2C69C31B4B29A
  val_sha256: 396BDDEC26B222A91CCE502137D73C46E1687C46C6764C97F3CE40F39C51B390
  test_sha256: 54E658F5633B87F9886800DC412FCDCBBBFBF7A1955A4954AC030EEECCDC1240
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
