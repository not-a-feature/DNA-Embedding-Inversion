data:
  shuffle: true
  mean: false
  train_csv: data/train_ntv2_100_hg38_per_token.h5
  val_csv: data/val_ntv2_100_hg38_per_token.h5
  test_csv: data/test_ntv2_100_hg38_per_token.h5
  embedding_dim: 1024
  seq_length: 100
  train_sha256: 64FC79137244B807126F143A74979EFDE70545657265CEE2128BEE9E8A73D3EB
  val_sha256: 3F4B87E5953B70C7311908AAF56B3C84B85C3FF480646E160AB98BDF5AC60739
  test_sha256: E7547889C891E259CF82D755CCD0C82077B0FE298FA07ABC5C7439DB7A0EEC75
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
model:
  model_file_name: model/mlp.py
  model_name: mlp_small
  model_type: mlp
  mode: per_token
  hidden_dims:
  - 256
  - 256
  - 128
  dropout: 0.2
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
