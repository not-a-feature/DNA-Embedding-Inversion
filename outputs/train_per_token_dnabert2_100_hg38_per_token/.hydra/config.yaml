data:
  shuffle: true
  mean: false
  train_csv: data/train_dnabert2_100_hg38_per_token.h5
  val_csv: data/val_dnabert2_100_hg38_per_token.h5
  test_csv: data/test_dnabert2_100_hg38_per_token.h5
  embedding_dim: 768
  seq_length: 100
  train_sha256: 069D1903AB0795ACA3FB4C2FBB93C168DC02BBADC61D9A1200E544C1476220C5
  val_sha256: 0ED17FB29F99B80E28BC27112AB614250C9E2EB14C1D41467B6CF1A2E1C53BA7
  test_sha256: 7AAE4236CC3C8A8D50DA4F58FCDAE32F170FE1DE01EB48136B1A43318B459DC1
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: huggingface
    model_name: zhihan1996/DNABERT-2-117M
model:
  model_file_name: model/mlp.py
  model_name: mlp_small
  model_type: mlp
  mode: per_token
  hidden_dims:
  - 256
  - 256
  - 128
  dropout: 0.2
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
