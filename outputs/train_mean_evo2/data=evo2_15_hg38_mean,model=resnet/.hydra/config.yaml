data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_15_hg38.h5
  val_csv: data/val_evo2_deep_15_hg38.h5
  test_csv: data/test_evo2_deep_15_hg38.h5
  embedding_dim: 4096
  seq_length: 15
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 9553306B0D97778AAB08C15F92A9EA4C32EB2848D7499B21D025B2CC34A40431
  val_sha256: 85D0FFFA6A97A060A84F92A49BA1969A313C8F5C840521456F434A288829D1C5
  test_sha256: D8BDD2BD1DBD66D651A1CE63508F0B06322E1DD0D3CF9FD8342117176A951F14
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
