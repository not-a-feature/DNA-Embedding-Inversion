data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_20_hg38.h5
  val_csv: data/val_evo2_deep_20_hg38.h5
  test_csv: data/test_evo2_deep_20_hg38.h5
  embedding_dim: 4096
  seq_length: 20
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: E44D40900407BD58D83355AB772D769A4D862ADD8E4B03BD59C2ADCAD60BDBFB
  val_sha256: CE33D6D3631F3C71643897BDD01AA35687CD22DD984A40EC9795936211D37DC4
  test_sha256: 2E7FF3F2200952AAB264F7C2A7F5AD5BF99EEEDFA9C76906D44628166C4AABB0
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
