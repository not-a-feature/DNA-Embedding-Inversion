data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_100_hg38.h5
  val_csv: data/val_evo2_deep_100_hg38.h5
  test_csv: data/test_evo2_deep_100_hg38.h5
  embedding_dim: 4096
  seq_length: 100
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 9816ABB4FFAB3E6C80DB86FAC7079BED188C1F0DE049CE41A0CDA4533BEC7465
  val_sha256: 88EF9CEE687FBF6267815DF627F30C3409974D0AD48C68ABA7FD0EF446E445C8
  test_sha256: F75F92F3CAF7505421CEA4CF752649D3624F98B84C3B85A669F2C75C6F4EF735
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
