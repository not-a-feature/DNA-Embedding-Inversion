data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_10_hg38.h5
  val_csv: data/val_evo2_deep_10_hg38.h5
  test_csv: data/test_evo2_deep_10_hg38.h5
  embedding_dim: 4096
  seq_length: 10
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: A11D0147447AECB5938B35D1A8592BCB552017E4BFDCDBD4C0D7F661B5B2FF3E
  val_sha256: DF0ECE451B631B753ADD60901FB9BC9B3D58EC5026E3529618D16A829F485078
  test_sha256: 7B0EF139D78CE0AC45CE59B1CA3EBE7350261C4EA5E1E8437AC5D3DD517B0F97
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
