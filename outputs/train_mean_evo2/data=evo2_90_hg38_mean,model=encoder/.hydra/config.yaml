data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_90_hg38.h5
  val_csv: data/val_evo2_deep_90_hg38.h5
  test_csv: data/test_evo2_deep_90_hg38.h5
  embedding_dim: 4096
  seq_length: 90
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: B0DE872C015100C551BD164F1175F351BE773BF130C011F8E9F4C455DB8D9B3F
  val_sha256: 0A6B0CB6144C00474D1611C5CF3B3C090A1515366E5CC0B64DB9B3F658671B3E
  test_sha256: 5DF988D95F67580B6C7E4C19E90D19BD700B46182D738DCE3CA8C74A21E28FF0
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
