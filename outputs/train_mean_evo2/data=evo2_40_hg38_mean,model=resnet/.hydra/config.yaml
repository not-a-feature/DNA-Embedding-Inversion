data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_40_hg38.h5
  val_csv: data/val_evo2_deep_40_hg38.h5
  test_csv: data/test_evo2_deep_40_hg38.h5
  embedding_dim: 4096
  seq_length: 40
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 9F0692C226B20CED8A0874919BD1C2930E54AA5E3AA1EE4FD50D8CE97D5A5472
  val_sha256: CF4CF1EEBA13050BF218450779C5389E2AA637657F386A254E6BBCFCEE5548F3
  test_sha256: 194F835A392F406E3BD59DB23628D9C876379840E9FC401EE40F6B1080ECBFA1
model:
  model_file_name: model/resnet.py
  model_name: resnet_mean
  model_type: resnet
  mode: mean
  d_model: 256
  n_blocks: 4
  kernel_size: 5
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
