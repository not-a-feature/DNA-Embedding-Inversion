data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_50_hg38.h5
  val_csv: data/val_evo2_deep_50_hg38.h5
  test_csv: data/test_evo2_deep_50_hg38.h5
  embedding_dim: 4096
  seq_length: 50
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: F9D2E3AF399D87EA0763A33BD482E2717A0204C29543D91B808725A3A0CC000A
  val_sha256: 9C23A4B9654A12C437F1DFFDE8C9375DF97F66D5E0FDD49D0A105A760147518A
  test_sha256: 357B00EE496C3E46E1CA914C172E9E882CFBB4EF299D36B7069284E71493EE39
model:
  model_file_name: model/decoder.py
  model_name: decoder_mean
  model_type: decoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.2
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
