data:
  shuffle: true
  mean: true
  train_csv: data/train_evo2_deep_30_hg38.h5
  val_csv: data/val_evo2_deep_30_hg38.h5
  test_csv: data/test_evo2_deep_30_hg38.h5
  embedding_dim: 4096
  seq_length: 30
  skip_sha256_check: false
  normalization_method: standard
  subset_fraction: null
  tokenizer:
    type: char
  train_sha256: 8B7EFB174D68EA34F97C59598D4167AC49F39AB032C00092D62665EBA2337365
  val_sha256: 3DCC59C8F213F39CD100238F0E48B84CB408C347F7F5C487F798A077B60CFB89
  test_sha256: 4973D75693D25337F2BDDE2EC4D2C2235DA41D5CC8AFD15D97D53508F5A24C98
model:
  model_file_name: model/encoder.py
  model_name: encoder_mean
  model_type: encoder
  mode: mean
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  output_dim: 4
  hidden_dims: []
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  batch_size: 32
  num_workers: 0
  use_scheduler: true
  scheduler:
    max_lr: 0.001
    pct_start: 0.3
    anneal_strategy: cos
    div_factor: 25.0
    final_div_factor: 10000.0
train:
  seed: 42
  project: dna-embedding-inversion
  run_name: null
  use_wandb: false
  log_interval: 30
  device: cuda:0
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  max_val_samples: null
